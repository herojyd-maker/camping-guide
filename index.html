<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전국 캠핑장 안내</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 디자인 기준: DESIGN.md -->
  <header class="top-nav">
    <div class="wrap top-nav-inner">
      <a class="wordmark" href="./">캠핑장 안내</a>
      <div class="nav-actions">
        <a class="nav-link" href="./workflow.html">제작 과정</a>
        <button id="nearby" type="button" class="btn-secondary">내 위치에서 찾기</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <form id="search-form" class="search-pill">
        <label class="segment">
          <span class="segment-label">어디로</span>
          <input id="search" type="search" placeholder="지역 또는 캠핑장 이름 (예: 수원, 강릉, 가평)" autocomplete="off">
        </label>
        <button type="submit" class="search-orb" aria-label="주변 찾기">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7"></circle>
            <path d="M16 16l5.5 5.5"></path>
          </svg>
        </button>
      </form>
      <p id="notice" class="notice" hidden></p>
      <h1>어디로 캠핑을 떠날까요?</h1>
      <p class="hero-sub">지역 이름을 입력하면 그 주변 캠핑장을 가까운 순으로 보여 드립니다.</p>
    </div>
  </section>

  <div class="category-strip">
    <nav id="regions" class="wrap tabs" aria-label="지역 선택"></nav>
  </div>

  <main class="wrap">
    <div class="toolbar">
      <div id="features" class="pills" aria-label="조건 선택"></div>
      <label class="sort">정렬
        <select id="sort">
          <option value="reviews">리뷰 많은 순</option>
          <option value="rating">별점 높은 순</option>
          <option value="price">가격 낮은 순</option>
          <option value="distance" disabled>가까운 순</option>
        </select>
      </label>
    </div>

    <section class="layout">
      <div>
        <p id="count" class="count"></p>
        <ul id="list" class="cards"></ul>
        <button id="more" type="button" class="btn-secondary more" hidden>더 보기</button>
      </div>
      <aside class="map-box">
        <div id="map" class="map"></div>
        <div id="map-fallback" class="map-fallback" hidden>
          <strong>지도를 표시할 수 없습니다</strong>
          <p>인터넷 연결을 확인해 주세요. 목록과 검색은 그대로 사용할 수 있습니다.</p>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="detail" class="detail">
    <button id="detail-close" class="icon-button" aria-label="닫기">&times;</button>
    <div id="detail-body"></div>
  </dialog>

  <footer class="footer">
    <div class="wrap">
      <p id="data-note"></p>
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/campsites.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
